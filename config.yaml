# Bioarena field controller — configuration
# Edit this file and restart the service to apply changes.
# Unknown keys produce a startup error (typo protection).
#
# This file is per-field. Record what a given site is set to in docs/sites/.

# Match period durations (seconds).
# FRC 2026 defaults: 20s auto, 3s pause, 140s teleop, 30s warning.
auto_duration_seconds: 20
pause_duration_seconds: 3
teleop_duration_seconds: 140
warning_remaining_seconds: 30

# HTTP port for the web interface.
http_port: 8080

# Configure the Wi-Fi AP and Ethernet switch on each match load.
# Requires the AP and switch addresses and passwords set under Arena > Settings.
#
# Defaults to true, including when this key is absent entirely.
#
# Only seeds the database on a first run. After that the Settings page is authoritative,
# so this value is ignored -- toggle it under Arena > Settings, where the change sticks
# across restarts.
#
# Off means nothing contacts the switch or the AP, and it does so without errors, which
# reads as the network silently not working.
network_security_enabled: true

# E-stop panel Pis (one per alliance).
# Set host to the panel Pi's address and port, e.g. "http://10.0.100.11:8765"
# Leave host empty ("") to skip polling that alliance's panel.
# A configured panel that stops answering is treated as a wiring fault on all
# three of its stations, which stops the field and blocks match start — so
# only configure a panel you actually intend to keep running.
# red_estop_panel:
#   host: ""
# blue_estop_panel:
#   host: ""
