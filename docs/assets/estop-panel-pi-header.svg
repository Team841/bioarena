<g font-size="12" dominant-baseline="central">
<circle cx="50" cy="244" r="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.75"/><text x="50" y="244" text-anchor="middle" font-weight="600" fill="#4A1B0C">E1</text><text x="68" y="244" fill="#2C2C2A">Station 1 e-stop · BCM 4 · pin 7</text>
<circle cx="360" cy="244" r="10" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.75"/><text x="360" y="244" text-anchor="middle" font-weight="600" fill="#04342C">A1</text><text x="378" y="244" fill="#2C2C2A">Station 1 a-stop · BCM 27 · pin 13</text>
<circle cx="50" cy="270" r="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.75"/><text x="50" y="270" text-anchor="middle" font-weight="600" fill="#4A1B0C">E2</text><text x="68" y="270" fill="#2C2C2A">Station 2 e-stop · BCM 12 · pin 32</text>
<circle cx="360" cy="270" r="10" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.75"/><text x="360" y="270" text-anchor="middle" font-weight="600" fill="#04342C">A2</text><text x="378" y="270" fill="#2C2C2A">Station 2 a-stop · BCM 23 · pin 16</text>
<circle cx="50" cy="296" r="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.75"/><text x="50" y="296" text-anchor="middle" font-weight="600" fill="#4A1B0C">E3</text><text x="68" y="296" fill="#2C2C2A">Station 3 e-stop · BCM 13 · pin 33</text>
<circle cx="360" cy="296" r="10" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.75"/><text x="360" y="296" text-anchor="middle" font-weight="600" fill="#04342C">A3</text><text x="378" y="296" fill="#2C2C2A">Station 3 a-stop · BCM 25 · pin 22</text>
<circle cx="50" cy="322" r="10" fill="#F0997B" stroke="#993C1D" stroke-width="0.75"/><text x="50" y="322" text-anchor="middle" font-weight="600" fill="#4A1B0C">F</text><text x="68" y="322" fill="#2C2C2A">Field e-stop, all six · BCM 6 · pin 31</text>
<circle cx="360" cy="322" r="9" fill="#B4B2A9" stroke="#444441" stroke-width="1.5"/><text x="378" y="322" fill="#2C2C2A">GND · any grey pin</text>
<circle cx="50" cy="348" r="9" fill="none" stroke="#444441" stroke-width="1.5" stroke-dasharray="3 2"/><text x="68" y="348" fill="#2C2C2A">Reserved for NO if upgraded to dual-channel: pins 11, 15, 18, 29. Leave free.</text>
</g>
<text x="40" y="380" font-size="12" fill="#5F5E5A">Default: one NC contact per button, same pinout on both panels. Station 1 is R1 or B1.</text>
</svg>
