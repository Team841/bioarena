# NetworkManager drop-in for a bioarena field controller.
# Install on the Pi as /etc/NetworkManager/conf.d/99-bioarena-unmanaged.conf,
# then: sudo systemctl reload NetworkManager
#
# Raspberry Pi OS Bookworm and Trixie manage interfaces with NetworkManager, which claims
# every device that appears -- including the 802.1Q subinterfaces bioarena creates with
# ip(8) on each match load. Left managed, NetworkManager starts a DHCP client on each one
# and can drop the gateway address bioarena just assigned, so a station loses its subnet
# seconds after being registered.
#
# The pattern must match the trunk interface named by local_network.trunk_interface in
# config.yaml. Change eth0 below if the field NIC has a different name -- predictable
# names such as enp1s0 are common on other hardware.

[keyfile]
unmanaged-devices=interface-name:eth0.*
